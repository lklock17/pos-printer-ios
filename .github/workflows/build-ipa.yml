name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Xcode Archive
        run: |
          xcodebuild archive \
            -project POSPrinter.xcodeproj \
            -scheme POSPrinter \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/POSPrinter.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA Package
        run: |
          mkdir -p build/Payload
          cp -r build/POSPrinter.xcarchive/Products/Applications/POSPrinter.app build/Payload/
          cd build
          zip -r POSPrinter.ipa Payload
          echo "=== IPA FILE CREATED SUCCESSFULLY ==="
          ls -lh POSPrinter.ipa

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POSPrinter-iOS-IPA
          path: build/POSPrinter.ipa
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          git tag -d latest || true
          git push origin :refs/tags/latest || true
          gh release create latest build/POSPrinter.ipa \
            --title "POS Printer iOS (Latest IPA)" \
            --notes "File IPA untuk printer thermal Bluetooth Kassen MT200A. Siap di-install ke iPhone/iPad menggunakan Sideloadly, AltStore, TrollStore, atau Scarlet."
