name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Compile & Package IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Xcode Archive
        run: |
          xcodebuild archive \
            -project POSPrinter.xcodeproj \
            -scheme POSPrinter \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/POSPrinter.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA Package
        run: |
          mkdir -p build/Payload
          cp -r build/POSPrinter.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r POSPrinter.ipa Payload
          cp POSPrinter.ipa OmniPOS.ipa
          echo "=== IPA FILE CREATED SUCCESSFULLY ==="
          ls -lh POSPrinter.ipa OmniPOS.ipa

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniPOS-iOS-IPA
          path: |
            build/POSPrinter.ipa
            build/OmniPOS.ipa
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest build/POSPrinter.ipa build/OmniPOS.ipa --clobber || gh release create latest build/POSPrinter.ipa build/OmniPOS.ipa --title "OmniPOS & Thermal Suite (Latest)" --notes "OmniPOS Universal: Aplikasi Kasir POS & Cetak Label Pengiriman 4x6 untuk iOS (Sideload via Sideloadly/AltStore/TrollStore/Scarlet)."
