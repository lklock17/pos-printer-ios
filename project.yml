name: POSPrinter
options:
  bundleIdPrefix: com.lklock17
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    PRODUCT_NAME: "OmniPOS"
    INFOPLIST_FILE: POSPrinter/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  POSPrinter:
    type: application
    platform: iOS
    sources:
      - POSPrinter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lklock17.posprinter
